name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    name: make check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test (ASan + UBSan, then normal rebuild)
        run: make check

  mo:
    name: MO judge suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python3 -m pip install pytest
      - name: Run MO judge suite
        run: python3 -m pytest mo/ -q
